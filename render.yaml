services:
  - type: web
    name: reviewguard-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -m src.ingest"
    startCommand: "uvicorn src.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: reviewguard
